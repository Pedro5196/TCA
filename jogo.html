        let joiasativas = {
            purple:false,
            yellow:false,
            blue:false,

        function iscolliding(wall1,wall2)
        {
            if (wall1.x + wall1.width > wall2.x &&
                wall1.x < wall2.x + wall2.width &&
                wall1.y + wall1.height > wall2.y &&
                wall1.y < wall2.y + wall2.height
            )
            {
                return true}
        }

        function clearmovement()
        { Object.keys(keys).forEach(function(key)
            {keys[key] = false})}

        function kill(x, y)
        {
            clearmovement()
            player.x = x
            player.y = y
            alert("Morreu!")
        }



        function lightup(wall)
        {
            activewalls.forEach(function(walla)
        {
            if (walla.id == wall.cor)
        {
            walla.cor = walla.id
            joiasativas[walla.cor] = true
            player.y = wall.y
            player.x = wall.x - 80
            clearmovement()
        }
        })
        }



            function novaarea(wall)
            {

               activewalls = walls[wall.area]
               player.x = wall.spawnx
               player.y = wall.spawny


            }


        function gema(cor, wall)
        {
            if (joias[cor] == true)
        {
            lightup(wall)
        }
        else
        {
            alert("Precisa da joia pra colocar aqui")
            player.y = wall.y
            player.x = wall.x - 80
            clearmovement()
        }
        }





        function movel(wall)
        {
        if (wall.direction == "y")
            {if(wall.y <= wall.maxC)
            {
               wall.direcao = "baixo"
            }
            else
            {
               if (wall.y >= wall.maxB - wall.height)
               {
                 wall.direcao = "cima"
               }
            }
            if (wall.direcao == "cima")
            {
                wall.y = wall.y - wall.speed
            }
            else
            {
                wall.y = wall.y + wall.speed
            }
            if (iscolliding(wall, player))
            {kill(wall.respawnx, wall.respawny)}}


            else
            {


                if(wall.x <= wall.maxE)
            {
               wall.direcao = "direita"
            }
            else
            {
               if (wall.x >= wall.maxD + wall.width)
               {
                 wall.direcao = "esquerda"
               }
            }
            if (wall.direcao == "direita")
            {
                wall.x = wall.x + wall.speed
            }
            else
            {
                wall.x = wall.x - wall.speed
            }
            if (iscolliding(wall, player))
            {kill(wall.respawnx, wall.respawny)}


            }
            }


        function create()
        {
            brush.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            )

            activewalls.forEach(function(wall)
            {

            if (wall.id == "movel")
            {
                movel(wall)
            }
            if (wall.cor)
            {
                brush.fillStyle = wall.cor
            }
                brush.fillRect(
                    wall.x,
                    wall.y,
                    wall.width,
                    wall.height
                )
                brush.fillStyle = "black"
                brush.fillStyle = "black"
            }

            )
        }

        window.addEventListener("keydown", function(event)
    {
        keys[event.key] = true
    })

        window.addEventListener("keyup", function(event)
    {
        keys[event.key] = false
    })





        function gameloop()
        {
            if (keys["w"] || keys["W"]) {player.y = player.y - player.speed}
            if (keys["s"] || keys["S"]) {player.y = player.y + player.speed}


            for (let i = 0; i<activewalls.length; i++)
        {   let wall = activewalls[i]
            if (iscolliding(player, wall))

        {   if (wall.id == "area")
        {   if (wall.locked == false)
            {novaarea(wall)
            return requestAnimationFrame(gameloop)}
            else
            {
                let destrancar = true
                Object.keys(joiasativas).forEach(function(joia)
                {


                    if (joiasativas[joia] == false)
                {
                    destrancar = false
                }


                })
                 if (destrancar == true)
                {
                    wall.locked = false
                }
                else {if (destrancar == false)
                {alert("você precisa coletar as joias pra abrir essa porta")
                player.x = wall.x -80
                player.y = wall.y + 75
                 clearmovement()
                return requestAnimationFrame(gameloop)}}
            }
        }
        else
        {
            if (wall.id == "joiastore")
        {
            gema(wall.cor, wall)
            return requestAnimationFrame(gameloop)
        }
        else
        if (wall.id == "dima")

            {alert("Coletou a joia " + wall.cor + "!")

        }
        }



            if (keys["d"] || keys["D"]) {player.x = player.x + player.speed}

         else

        }

            if (keys["d"] || keys["D"]) {player.x = wall.x - player.width}
            if (keys["a"] || keys["A"]) {player.x = wall.x + wall.width}
        }
        }

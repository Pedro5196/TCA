        function projetilou(projetil)

        function torretat(torreta)
        {   let agora = Date.now()

            if ((agora - torreta.ultimodisparo) < (torreta.frequency *1000))
            {
                return
            }
            torreta.ultimodisparo = agora
            let dx = (player.x + (player.width/2)) - (torreta.x + (torreta.width/2))
            let dy = (player.y + (player.height/2))- (torreta.y + (torreta.height/2))
            let distancia = Math.sqrt((dx * dx) + (dy *dy))
            let directx = dx/distancia
            let directy = dy/distancia
            let projectile = new projetil(torreta.x + (torreta.width/2),torreta.y + (torreta.height/2), torreta.sizex, torreta.sizey,"projetil" , "red",directx, directy, torreta.speed)
            projectiles.push(projectile)
        }

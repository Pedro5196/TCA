<!DOCTYPE html>
<html lang="en">
<head>
  
</head>
<body>
    <canvas id = "canvas" width="1700" height="2000"></canvas>
    <script>


        let keys = {}
        let canvas = document.getElementById("canvas")
        let brush = canvas.getContext("2d")
        let player = {
            x:50,
            y:50,
            width:50,
            height:50,
            speed:15
        }


        class wall{
            constructor(x,y,width,height, id,  cor, maxE, maxD, maxC, maxB, direcao, area)
            {
                this.x = x
                this.y = y
                this.width = width
                this.height = height
                this.id = id
                this.cor = cor
                this.maxE = maxE
                this.maxD = maxD
                this.maxC = maxC
                this.maxB = maxB
                this.direcao = direcao
                this.area = area
            }
        }



        class areachanger{
            constructor(x,y,width,height, id,  cor, area, spawnx, spawny)
                {this.x = x
                this.y = y
                this.width = width
                this.height = height
                this.id = id
                this.cor = cor
                this.area = area
                this.spawnx = spawnx
                this.spawny = spawny}
        }
        let walls = [
                [
                new wall (0,0, 1400, 30, "parede"),
                new wall (0,0, 30, 700, "parede"),
                new wall (0,670, 1400, 30, "parede"),
                new wall (1370,0, 30, 700, "parede"),
                new wall (300, 0, 80, 340, "parede"),
                new wall (500, 400, 80, 340, "parede"),
                new wall (900, 50, 80, 340, "movely", "red", 0,0,30, 670, "cima"),
                new wall (1100, 330, 80, 340, "movely", "red", 0,0,30, 670, "cima"),
                new wall (700, 330, 80, 340, "movely", "red", 0,0,30, 670, "cima"),
                new areachanger (1340, 250, 30, 200, "area", "green", 1, 100, 250)],
            
            
                [new wall (0,0, 1400, 30, "parede"),
                new wall (0,0, 30, 700, "parede"),
                new wall (0,670, 1400, 30, "parede"),
                new wall (1370,0, 30, 700, "parede"),
                new areachanger (30, 250, 30, 200, "area", "green", 0, 1200, 250 ),
                new wall (1000, 125, 70, 70, "joia", "purple"),
                new wall (1000, 250, 70, 70, "joia", "yellow"),
                new wall (1000, 375, 70, 70, "joia", "blue"),
                new wall (1000, 500, 70, 70, "joia", "darkgreen")],
            
            
            
            
            
            
            
            
            
            
            ]
        let activewalls = walls[0]
        function iscolliding(wall1,wall2)
        {
            if (wall1.x + wall1.width > wall2.x &&
                wall1.x < wall2.x + wall2.width &&
                wall1.y + wall1.height > wall2.y &&
                wall1.y < wall2.y + wall2.height
            )
            {
                return true}
        }




        function kill()
        {
            player.x = 50
            player.y = 50
            alert("Morreu!")
        }


            function novaarea(wall)
            { 
            
               activewalls = walls[wall.area]
               player.x = wall.spawnx
               player.y = wall.spawny
            
            }



        function movel(wall)
        {
            if(wall.y <= wall.maxC)
            {
               wall.direcao = "baixo"
            }
            else
            {
               if (wall.y >= wall.maxB - wall.height)
               {
                 wall.direcao = "cima"
               }
            }
            if (wall.direcao == "cima")
            {
                wall.y = wall.y - 15
            }
            else
            {
                wall.y = wall.y + 15
            }
            if (iscolliding(wall, player))
            {kill()}
            }


        function create()
        {
            brush.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            )

            activewalls.forEach(function(wall)
            {
            
                if (wall.id === "movely")
            {
                movel(wall)
            }
            if (wall.cor)
            {
                brush.fillStyle = wall.cor
            }
                brush.fillRect(
                    wall.x,
                    wall.y,
                    wall.width,
                    wall.height
                )
                brush.fillStyle = "black"
            }
              
            )
        }

        window.addEventListener("keydown", function(event)
    {
        keys[event.key] = true
    })

        window.addEventListener("keyup", function(event)
    {
        keys[event.key] = false
    })
    

        


        function gameloop()
        {
            if (keys["w"] || keys["W"]) {player.y = player.y - player.speed}
            if (keys["s"] || keys["S"]) {player.y = player.y + player.speed}


            for (let i = 0; i<activewalls.length; i++)
        {   let wall = activewalls[i]
            if (iscolliding(player, wall))
        {   if (wall.id == "area")
        {
             if (iscolliding(wall, player))
            {novaarea(wall)
                return requestAnimationFrame(gameloop)
            }
        }
            if (keys["w"] || keys["W"]) {player.y = wall.y + wall.height}
            if (keys["s"] || keys["S"]) {player.y = wall.y - player.height}
        }
        }



            if (keys["d"] || keys["D"]) {player.x = player.x + player.speed}
            if (keys["a"] || keys["A"]) {player.x = player.x - player.speed}
       
            
              for (let i = 0; i<activewalls.length; i++)
        {   let wall = activewalls[i]
            if (iscolliding(player, wall))
        {   if (wall.id == "area")
        {
             if (iscolliding(wall, player))
            {novaarea(wall)
                return requestAnimationFrame(gameloop)
            }
        }
            if (keys["d"] || keys["D"]) {player.x = wall.x - player.width}
            if (keys["a"] || keys["A"]) {player.x = wall.x + wall.width}
        }
        }




            brush.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            )
            create()
            requestAnimationFrame(gameloop)
        }
        gameloop()
    </script>
</body>
</html>
